<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>必须记 · 加载中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #F5F4F1;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    color: #1A1918;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .icon { width: 88px; height: 88px; margin-bottom: 28px; }
  .name {
    font-size: 22px; font-weight: 600;
    letter-spacing: 1px; margin-bottom: 10px;
  }
  .status {
    font-size: 13px; color: #8A867E;
    display: flex; align-items: center; gap: 6px;
  }
  .dots { display: inline-flex; gap: 4px; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #3D8A5A;
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(2) { animation-delay: 0.16s; }
  .dot:nth-child(3) { animation-delay: 0.32s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40%           { opacity: 1;    transform: translateY(-4px); }
  }
  .footer {
    position: absolute; bottom: 32px;
    font-size: 11px; color: #A8A49C;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <!-- 与桌面 / 系统托盘同款的「必」勾选图标 -->
  <svg class="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#5BA678"/>
        <stop offset="100%" stop-color="#2F6E45"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="512" rx="230" ry="230" fill="#FFFFFF" opacity="0.06"/>
    <path d="M280 530 L450 700 L750 360"
          stroke="#FFFFFF" stroke-width="90"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="820" cy="220" r="48" fill="#A8D9BC"/>
  </svg>

  <div class="name">必须记</div>
  <div class="status">
    正在加载
    <span class="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </div>

  <div class="footer">极简个人生活管理 · 双端实时同步</div>
</body>
</html>
